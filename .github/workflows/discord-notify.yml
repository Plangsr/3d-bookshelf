name: Vercel Deploy & Discord Status

on:
  push:
    branches:
      - main

jobs:
  notify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Vercel Deployment to Finish
        run: |
          echo "Waiting 30 seconds for Vercel to finish building and deploying..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://3d-bookshelf-eosin.vercel.app || echo "000")
          echo "Vercel live status code: $STATUS"

      - name: Send Discord Deployment Notification (Success)
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEPLOY_STATUS: "SUCCESS"
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: node .github/scripts/notify-discord.mjs

      - name: Send Discord Deployment Notification (Failure)
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEPLOY_STATUS: "FAILED"
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: node .github/scripts/notify-discord.mjs
